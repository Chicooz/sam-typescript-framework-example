AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for the project

Resources:
  # Existing resources...

  QueueProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/queueProcessor.handler
      Runtime: nodejs14.x
      Events:
        QueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MyQueue.Arn

  MyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: MyQueue

Outputs:
  # Existing outputs...