AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description:  Authorized API

Parameters:
  EnvironmentType:
    Description: The environment type
    Type: String
    Default: Dev
    AllowedValues:
      - Dev
      - Prod
    ConstraintDescription: Must specify either 'Dev' or 'Prod'. Default is 'Dev'.

Globals:
  Function:
    Tracing: Active
    Runtime: nodejs16.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref EnvironmentType
  Api:
    TracingEnabled: True

Resources:
  Auth:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Auth
      Handler: src/handlers/authorize.handler
      Runtime: nodejs16.x
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "Users-${EnvironmentType}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/authorize.ts

  LambdaAuthInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/service-role/"
      Policies:
        - PolicyName: AuthInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt Auth.Arn

  ExampleApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentType
      Auth:
        Authorizers:
          Auth:
            FunctionInvokeRole: !GetAtt LambdaAuthInvokeRole.Arn
            FunctionArn: !GetAtt Auth.Arn
            IdentitySource: "$request.header.Authorization"
            FunctionPayloadType: TOKEN

  # auth
  Authorization:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/authenticate.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "Users-${EnvironmentType}"
      Events:
        RestAuthGet:
          Type: Api
          Properties:
            Path: "/login"
            Method: post
            RestApiId: !Ref ExampleApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/authenticate.ts

# contracts
  createContract:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/createContract.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "Contracts-${EnvironmentType}"
      Events:
        RestAuthGet:
          Type: Api
          Properties:
            Auth:
              Authorizer: Auth
            Path: "/createContract"
            Method: post
            RestApiId: !Ref ExampleApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/createContract.ts

  getContractIDs:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getContractIDs.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "Contracts-${EnvironmentType}"
      Events:
        RestAuthGet:
          Type: Api
          Properties:
            Auth:
              Authorizer: Auth
            Path: "/getContractIDs"
            Method: get
            RestApiId: !Ref ExampleApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/getContractIDs.ts


  getContract:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getContract.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "Contracts-${EnvironmentType}"
      Events:
        RestAuthGet:
          Type: Api
          Properties:
            Auth:
              Authorizer: Auth
            Path: "/getContract"
            Method: get
            RestApiId: !Ref ExampleApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/getContract.ts


  # $default route used as catchall
  CatchAllLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/all.handler
      Events:
        RestCatchAll:
          Type: Api
          Properties:
            Path: /{all+}
            Method: get
            RestApiId: !Ref ExampleApi

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Users-${EnvironmentType}"
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: authToken
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: usernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: authTokenIndex
          KeySchema:
            - AttributeName: authToken
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ContractsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Contracts-${EnvironmentType}"
      KeySchema:
        - AttributeName: contractID
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: contractID
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # SQS Queue
  MyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "MyQueue-${EnvironmentType}"

  # Dead Letter Queue
  MyDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "MyDeadLetterQueue-${EnvironmentType}"

  # SQS Queue Policy
  MyQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref MyQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "SQS:SendMessage"
            Resource: !GetAtt MyQueue.Arn

  # Event Source Mapping for Lambda
  MyQueueEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      EventSourceArn: !GetAtt MyQueue.Arn
      FunctionName: !GetAtt Auth.Arn
      Enabled: true

  # CloudWatch Alarms for SQS
  MyQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alarm when the number of messages in the queue exceeds 5"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !Ref MyQueue
      AlarmActions:
        - !Ref MyQueueAlarmSNS

  MyQueueAlarmSNS:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "SNS Topic for SQS Alarm Notifications"

  # Log Retention Policy
  MyQueueLogRetention:
    Type: AWS::Logs::RetentionPolicy
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Auth}"
      RetentionInDays: 14

  # New Event Source Mapping for another Lambda function
  AnotherQueueEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 5
      EventSourceArn: !GetAtt MyQueue.Arn
      FunctionName: !GetAtt AnotherLambdaFunction.Arn
      Enabled: true

  # New Lambda Function
  AnotherLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/anotherHandler.handler
      Runtime: nodejs16.x
      MemorySize: 128
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "AnotherTable-${EnvironmentType}"
      Events:
        AnotherEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MyQueue.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/anotherHandler.ts

Outputs:
  RestApiEndpoint:
    Description: "Rest API endpoint URL"
    Value: !Sub "https://${ExampleApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentType}"